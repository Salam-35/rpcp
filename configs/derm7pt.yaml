_base_: base.yaml

# Derm7pt: external validation. Official splits in the manifest are respected.
name: rpcp-derm7pt

data:
  name: derm7pt
  root: datasets/derm7pt
  image_size: 224
  batch_size: 32
  num_workers: 4
  augment: true

model:
  backbone: densenet121
  pretrained: true
  dropout: 0.1

optim:
  lr: 0.00005
  backbone_lr: 0.000005
  epochs: 30
  grad_clip: 0.5
  early_stopping_patience: 12

reliability:
  warmup_epochs: 8
  mid_epochs: 14
  update_every: 2
  # NOTE: was 1, which silently disables instability estimation entirely
  # (`trainer.py` only computes `fold_class_means`/`estimate_instability` when
  # `n_folds > 1`) -- Evidence Mode A would have degraded to residual-only
  # for this dataset alone, with every other dataset config using 2-4 folds.
  n_folds: 3

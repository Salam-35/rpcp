[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpcp"
version = "0.1.0"
description = "Reliability-Weighted Concept Learning from Noisy Class-Level Priors (R-PCP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "R-PCP authors" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "tqdm>=4.66",
    "sympy>=1.14.0",
    "torchvision>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]
excel = ["openpyxl>=3.1"]

[project.scripts]
rpcp-train = "scripts.train:main"
rpcp-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["rpcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
